
name: Semgrep Security Lab CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-rules:
    name: Validate Semgrep rules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: |
          python -m pip install semgrep==1.186.0
          semgrep --version

      - name: Validate original taint rule
        run: semgrep --validate --config regles/taint-rule.yaml

      - name: Validate sanitizer rule
        run: semgrep --validate --config regles/taint-sanitizer.yaml

      - name: Validate false sanitizer experiment
        run: semgrep --validate --config regles/taint-faux-sanitizer.yaml
